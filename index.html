/* เวทีออกแบบ 1920x1080 ย่อ/ขยายตามสัดส่วนเดิมด้วย JS */
.stage {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: 1920px;
  height: 1080px;
  transform-origin: center bottom;
  transform: translateX(-50%) scale(var(--sx, 1), var(--sy, 1));
  user-select: none;
  -webkit-user-select: none;
}

/* แถบเหลืองต่อขึ้นไปด้านบนเมื่อหน้าต่างสูงกว่าภาพ */
.road {
  position: absolute;
  left: 939px;
  width: 112px;
  top: -4000px;
  height: 4000px;
  background: #f8d208;
}

/* กล่องตัวเลข (ทับบนกล่องในภาพพื้นหลัง) */
.box {
  position: absolute;
  overflow: hidden;
  top: 318px;
  width: 455px;
  height: 444px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.box.left  { left: 178px; }
.box.right { left: 1368px; }

.value {
  font-family: "Orbitron", "Arial Black", sans-serif;
  font-weight: 900;
  font-size: 210px;
  line-height: 1;
  height: 1em;
  display: block;
  text-align: center;
  font-variant-numeric: tabular-nums;
  color: #d9d9d9;
}

/* ปุ่มกลม เปลี่ยนสีแทนการเลื่อน */
.btn {
  position: absolute;
  top: 877px;
  width: 192px;
  height: 192px;
  border-radius: 50%;
  border: 2px solid #bdbdbd;
  cursor: pointer;
  outline: none;
  background: radial-gradient(circle at 35% 30%, #ffffff 0%, #ececec 45%, #cacaca 100%);
  box-shadow: 0 4px 8px rgba(0,0,0,.25), inset 0 -8px 14px rgba(0,0,0,.08);
  transition: background .3s ease, border-color .3s ease, box-shadow .3s ease;
}
.btn.left  { left: 309px; }
.btn.right { left: 1523px; }
.btn:focus-visible { box-shadow: 0 0 0 6px rgba(80,160,255,.6); }

.btn[aria-checked="true"] {
  border-color: #1f9d3a;
  background: radial-gradient(circle at 35% 30%, #b8ffc8 0%, #3ddc5a 45%, #14912f 100%);
  box-shadow: 0 0 28px rgba(61,220,90,.7), inset 0 -8px 14px rgba(0,0,0,.15);
}
</style>
</head>
<body>

<main class="stage" id="stage">
  <div class="road"></div>
  <div class="box left"><span class="value" id="v1">7</span></div>
  <div class="box right"><span class="value" id="v2">7</span></div>

  <button class="btn left"  role="switch" aria-checked="false" aria-label="ความเร็วช่อง1" data-target="v1"></button>
  <button class="btn right" role="switch" aria-checked="false" aria-label="ความเร็วช่อง2" data-target="v2"></button>
</main>

<script>
(() => {
  "use strict";

  const DESIGN_W = 1920, DESIGN_H = 1080;
  const MIN = 0, MAX = 99;      // ช่วงตัวเลขที่สุ่ม
  const UPDATE_MS = 800;        // สุ่มค่าใหม่ทุกกี่ ms ตอนปุ่มเปิด

  const stage = document.getElementById("stage");

  // ย่อ/ขยายตามสัดส่วนเดิม ไม่ยืดภาพ
  function fit() {
    const s = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
    stage.style.setProperty("--sx", s);
    stage.style.setProperty("--sy", s);
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
  fit();

  const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

  function setValue(id) {
    const el = document.getElementById(id);
    el.textContent = rand(MIN, MAX);
  }

  // สุ่มค่าเริ่มต้นตอนโหลดหน้า
  setValue("v1");
  setValue("v2");

  const timers = {};

  document.querySelectorAll(".btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const on = btn.getAttribute("aria-checked") !== "true";
      btn.setAttribute("aria-checked", String(on));

      const id = btn.dataset.target;
      clearInterval(timers[id]);
      if (on) {
        setValue(id);
        timers[id] = setInterval(() => setValue(id), UPDATE_MS);
      }
    });
  });
})();
</script>
</body>
</html>
